services:
  cycling-marketplace-bot:
    # Published by CI: .github/workflows/ci.yml
    image: ghcr.io/johnkimble/cycling-marketplace-bot:latest
    # For local development, build instead:  docker compose build
    build:
      context: .
    container_name: cycling-marketplace-bot
    restart: unless-stopped
    ports:
      - "3049:3049"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
